<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoboService</title>
    <style>body{padding:20px;font-family:Arial;}</style>
    <link rel="manifest" href="data:application/manifest+json,{
  'name':'LoboService',
  'short_name':'LoboOS',
  'start_url':'/',
  'display':'standalone',
  'background_color':'#fff',
  'theme_color':'#000',
  'icons':[{'src':'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgdmlld0JveD0iMCAwIDE5MiAxOTIiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxjaXJjbGUgY3g9Ijk2IiBjeT0iOTYiIHI9Ijk2IiBmaWxsPSIjMDAwIi8+Cjx0ZXh0IHg9Ijk2IiB5PSIxMjAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIzMCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiPkwnPC90ZXh0Pgo8L3N2Zz4=', 'sizes':'192x192'}]
}">
<meta name="theme-color" content="#000">
</head>
<body>
  <h1>🛠️ LoboService</h1>
  <input id="nome" placeholder="Nome do Cliente">
  <br><br>
  <input id="aparelho" placeholder="Modelo">
  <br><br>
  <button onclick="criaOs()">Criar O.S.</button>
  
  <h2>Ordens de Serviço:</h2>
  <div id="lista-os"></div>
  <div style="margin:10px;">
  <button onclick="mudarStatus('analise')">🔵 Análise</button>
  <button onclick="mudarStatus('concluida')">🟢 Concluída</button>
</div>
  
<script>

  let listaOs = JSON.parse(localStorage.getItem('minhasOs')) || [];
  mostrarLista();

  function salvarOs(){  
    localStorage.setItem('minhasOs', JSON.stringify(listaOs));
  }


function criaOs(){
  let nome = document.getElementById("nome").value;
  let aparelho = document.getElementById("aparelho").value;
  
  if(nome && aparelho){
    listaOs.push({nome, aparelho, status:"pendente"});
    document.getElementById("nome").value = "";
    document.getElementById("aparelho").value = "";
    mostrarLista();
    salvarOs();
  }
}


function mostrarLista(){
  let html = "";
  for(let i = 0; i < listaOs.length; i++){
    let status = listaOs[i].status;
    let cor = status=="pendente" ? "🟡" : 
              status=="analise" ? "🔵" : "🟢";
    
    html += `<div style="border:1px solid #ccc;padding:10px;margin:5px;">
      <h3>${listaOs[i].nome} - ${listaOs[i].aparelho}</h3>
      <p>${cor} ${status}</p>
      <button onclick="mudarUma(${i},'analise')">🔵 Análise</button>
      <button onclick="mudarUma(${i},'concluida')">🟢 Concluída</button>
    </div>`;
  }
  document.getElementById("lista-os").innerHTML = html;
}
function mudarStatus(novoStatus){
  if(listaOs.length > 0){
    listaOs[listaOs.length-1].status = novoStatus;
    mostrarLista();
  }
}
function mudarUma(indice, novoStatus){
  listaOs[indice].status = novoStatus;
  mostrarLista(); 
  salvarOs();
}
</script>
</body>
</html>
